name: 复用工作流 — 设备脚本测试

# A Reusable Workflow exists for units that need their OWN JOB: a runner, a
# matrix, its own permissions.  This one runs the firmware's own first-boot
# scripts against the REAL aarch64 uci under qemu, which is the only way to
# catch the class of bug the repo has already shipped once (a value written as
# `'0'` instead of `0`, which looks right in /etc/config and does nothing).
#
# Called by build.yml once a rootfs exists, and by checks.yml when a rootfs is
# supplied as an input.  `on: workflow_call` is what makes it reusable rather
# than merely dispatchable.
on:
  workflow_call:
    inputs:
      # Input names are snake_case because a hyphen CANNOT be used with dot
      # access in a GitHub expression: `inputs.artifact-name` parses as
      # `inputs.artifact - name` (subtraction), the expression fails to
      # compile, and the CALLER dies with `startup_failure` before a single job
      # starts.  That is exactly what happened: `${{ inputs.artifact-name }}`
      # in the Download step made build.yml unschedulable from the moment it
      # was introduced, and nothing caught it because build.yml only runs on
      # schedule/tag/dispatch — never on a pull request.
      artifact_name:
        description: Artifact containing the rootfs tarball.
        type: string
        required: true
      tarball_glob:
        # A BASENAME pattern, not a path pattern: it is handed to `find -name`,
        # which matches the final path component only.  The original default was
        # `**/*-targz-rootfs.tar.gz`, and `-name` never matches a pattern
        # containing `/` — so the rootfs was sitting in the artifact while this
        # job reported
        #
        #   no rootfs tarball in the artifact (looked for '**/*-targz-rootfs.tar.gz')
        #
        # Measured on the v1.1.2 release run, where the artifact did contain
        # openwrt-mediatek-filogic-hiveton_h5000m-targz-rootfs.tar.gz.
        description: Basename glob matching the rootfs tarball (used with find -name).
        type: string
        required: false
        default: '*-targz-rootfs.tar.gz'
      runner:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-24.04
    outputs:
      status:
        description: pass or fail
        value: ${{ jobs.script_test.outputs.status }}
    # No `secrets:` block on purpose.  `secrets: none: required: false` is NOT
    # valid — it declares a secret literally named "none" whose value is the
    # boolean `false`, which GitHub rejects at parse time and the whole workflow
    # silently disappears from the Actions list.  A reusable workflow that needs
    # no secrets simply omits the key.

permissions: {}

jobs:
  # The id is snake_case because it is referenced from an EXPRESSION above
  # (`jobs.<id>.outputs.<name>`); a hyphen there is parsed as subtraction.
  script_test:
    name: 首启脚本（真实 uci）
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.test.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts

      - name: Install qemu-user-static
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static file

      - name: Run the test
        id: test
        env:
          TARBALL_GLOB: ${{ inputs.tarball_glob }}
        run: |
          set -uo pipefail
          # The glob comes from the caller, so this workflow works for any
          # artifact layout instead of silently ignoring the input.
          tarball="$(find artifacts -type f -name "${TARBALL_GLOB}" | head -1)"
          if [ -z "$tarball" ]; then
            echo "::error::no rootfs tarball in the artifact (looked for '${TARBALL_GLOB}')"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "testing $tarball"
          ./scripts/rootfs-script-test.sh "$tarball"
          echo "status=pass" >> "$GITHUB_OUTPUT"
