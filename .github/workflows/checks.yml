name: 仓库与主机检查

# Mainline OpenWrt (openwrt/openwrt main) for the Hiveton H5000M.
# Checks live in their own workflow so the badge reflects them and nothing
# else.  GitHub badges are per workflow, and shields.io's ?job= parameter is
# ignored — a bogus job name still renders "passing" — so a single workflow with
# several jobs can only ever show one badge.
on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC (Beijing 12:00)
  push:
    tags:
      - 'openwrt-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gate: does this host have what the configuration stage needs, and is
  # the repository internally consistent?
  # ---------------------------------------------------------------------------
  check:
    name: Repository and host checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install configuration-stage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk unzip wget curl rsync zstd git patch python3

      - name: Check build host
        run: ./scripts/check-deps.sh

      - name: Shell syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "all scripts parse"

      - name: ShellCheck (errors only)
        run: |
          # -S error: fail on real bugs (unbound variables, bad expansions) but
          # not on style.  This is the class of bug that `local a="$1" b="${a}"`
          # is: every argument is expanded before any of them is assigned.
          shellcheck -S error scripts/*.sh

      - name: Verify target support upstream
        run: |
          set -euo pipefail
          # The whole project rests on openwrt/openwrt carrying this device.
          # Fail loudly here rather than 40 minutes into a build.
          . configs/upstream.env
          url="https://raw.githubusercontent.com/openwrt/openwrt/${OPENWRT_REPO_BRANCH}/target/linux/mediatek/image/filogic.mk"

          # Fetch into a variable rather than piping into `grep -q`.  With
          # `set -o pipefail`, `grep -q` exits as soon as it matches, curl is
          # killed by SIGPIPE, and the pipeline reports failure even though the
          # match succeeded:
          #
          #   curl: (23) Failure writing output to destination
          #   ##[error]hiveton_h5000m is not defined in ...
          #
          # which is what this step did on its first run against the real file.
          devices="$(curl -fsSL "$url")" \
            || { echo "::error::could not fetch ${url}"; exit 1; }
          case "$devices" in
            *"Device/${OPENWRT_PROFILE}"*)
              echo "found Device/${OPENWRT_PROFILE} on ${OPENWRT_REPO_BRANCH}" ;;
            *)
              echo "::error::${OPENWRT_PROFILE} is not defined in ${url}"
              exit 1 ;;
          esac

      - name: Verify tree patches still apply upstream
        run: |
          set -euo pipefail
          . configs/upstream.env
          git clone --depth 1 --branch "${OPENWRT_REPO_BRANCH}" \
            "${OPENWRT_REPO_URL}" /tmp/upstream-check
          status=0
          checked=0
          for p in patches/*.patch; do
            echo "--- $p"
            # Absolute: `git -C` changes the working directory, so a relative
            # patch path is looked up inside the clone instead of this checkout,
            # and git reports "can't open patch ... No such file or directory"
            # for a patch that is sitting right there.
            p="$(realpath "$p")"

            # Only patches against the OpenWrt tree itself can be checked here.
            # Some of ours target feed packages — 0003-sing-box-pin targets
            # feeds/packages/net/sing-box/Makefile — and this job clones the tree
            # without installing any feed, so those files do not exist and the
            # check reported "no longer applies to main" for a patch that was
            # perfectly fine.  Skip them, and say so, rather than fail.
            missing=0
            while IFS= read -r target; do
              case "$target" in
                feeds/*|package/feeds/*)
                  echo "    skipped: $target lives in a feed, which this check does not install"
                  missing=1
                  break
                  ;;
              esac
            done < <(git apply --numstat "$p" 2>/dev/null | awk '{print $3}')

            [ "$missing" = "1" ] && continue

            checked=$((checked + 1))
            if git -C /tmp/upstream-check apply --check "$p"; then
              echo "    applies"
            elif git -C /tmp/upstream-check apply --reverse --check "$p"; then
              echo "    already applied upstream"
            else
              echo "::error::patch $(basename "$p") no longer applies to ${OPENWRT_REPO_BRANCH}"
              status=1
            fi
          done
          echo "checked ${checked} tree patch(es)"
          exit $status

      # The three fullcone patches are not in patches/.  Their packages download
      # their own source into build_dir, so install_nftables_patches() copies each
      # one into that package's patches/ directory at build time — which means
      # nothing here verified them against the source upstream actually ships.
      #
      # That gap is expensive: nftables 1.1.6 -> 1.1.7 would not be noticed until
      # twenty minutes into a three-hour firmware build, and the failure would
      # read as a compile error.  This mirrors what the build does, but in the
      # cheap gate.
      #
      # The version and commit are read from the freshly cloned upstream tree, so
      # this follows a bump automatically instead of pinning our own copy.
      - name: Verify the fullcone patches still apply to the sources upstream ships
        run: |
          set -euo pipefail
          SRC=/tmp/upstream-check

          # Reuse the clone the previous step made; clone only if this step is
          # ever run on its own.
          if [ ! -d "$SRC" ]; then
            git clone --depth 1 --branch "${OPENWRT_REPO_BRANCH}" \
              "${OPENWRT_REPO_URL}" "$SRC"
          fi
          WORK=/tmp/fullcone-src
          rm -rf "$WORK"; mkdir -p "$WORK"
          status=0

          check_tarball() { # <package dir under the tree> <patch>
            local pkgdir="$1" patch="$2" name ver url file
            patch="$(realpath "$patch")"
            name=$(sed -n 's/^PKG_NAME:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            ver=$(sed -n 's/^PKG_VERSION:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            url=$(sed -n 's/^PKG_SOURCE_URL:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            file=$(sed -n 's/^PKG_SOURCE:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            url=${url//'$(PKG_NAME)'/$name}; url=${url//'$(PKG_VERSION)'/$ver}
            file=${file//'$(PKG_NAME)'/$name}; file=${file//'$(PKG_VERSION)'/$ver}

            echo "--- $(basename "$patch") against $name $ver"
            if ! curl -fsSL --retry 3 --max-time 120 -o "$WORK/$file" "$url/$file"; then
              echo "::error::cannot download $url/$file — upstream moved or renamed the source"
              status=1; return 0
            fi
            mkdir -p "$WORK/$name"
            tar -xf "$WORK/$file" -C "$WORK/$name" --strip-components=1
            if ( cd "$WORK/$name" && patch -p1 --dry-run < "$patch" >/dev/null ); then
              echo "    applies"
            else
              echo "::error::$(basename "$patch") no longer applies to $name $ver"
              ( cd "$WORK/$name" && patch -p1 --dry-run < "$patch" 2>&1 | head -6 ) || true
              status=1
            fi
          }

          check_git() { # <package dir under the tree> <patch> <repo url>
            local pkgdir="$1" patch="$2" repo="$3" name sha
            patch="$(realpath "$patch")"
            name=$(sed -n 's/^PKG_NAME:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            sha=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            echo "--- $(basename "$patch") against $name ${sha:0:12}"
            rm -rf "$WORK/$name"; mkdir -p "$WORK/$name"
            git -C "$WORK/$name" init -q .
            git -C "$WORK/$name" remote add origin "$repo"
            if ! git -C "$WORK/$name" fetch -q --depth 1 origin "$sha"; then
              echo "::error::cannot fetch $repo at $sha — upstream dropped that commit"
              status=1; return 0
            fi
            git -C "$WORK/$name" checkout -q FETCH_HEAD
            if ( cd "$WORK/$name" && patch -p1 --dry-run < "$patch" >/dev/null ); then
              echo "    applies"
            else
              echo "::error::$(basename "$patch") no longer applies to $name ${sha:0:12}"
              ( cd "$WORK/$name" && patch -p1 --dry-run < "$patch" 2>&1 | head -6 ) || true
              status=1
            fi
          }

          check_tarball package/libs/libnftnl          libnftnl-patches/100-fullcone-expression.patch
          check_tarball package/network/utils/nftables nftables-patches/100-fullcone-expression.patch
          check_git     package/network/config/firewall4 firewall4-patches/100-fullcone-support.patch \
                        https://git.openwrt.org/project/firewall4.git

          echo
          if [ "$status" -ne 0 ]; then
            echo "one or more fullcone patches no longer apply upstream"
          fi
          exit $status

      - name: Verify the board plugin repositories still exist
        run: |
          set -euo pipefail
          # These three are cloned straight from their upstreams into package/ at
          # build time, so a rename, a force-push to a different default branch,
          # or a deletion would only surface deep inside a build.  Check here.
          fail=0
          for repo in \
            FAN789/luci-app-h5000m-fancontrol \
            FAN789/luci-app-h5000m-netmode \
            FAN789/luci-app-mt5700m \
            ddimension/openwrt-repo
          do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${repo}")"
            if [ "$code" = "200" ]; then
              echo "ok   ${repo}"
            else
              echo "::error::${repo} is not reachable (HTTP ${code})"
              fail=1
            fi
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # Configuration coverage: every ENABLE_* profile must still produce a valid
  # .config.  Independent of the firmware build, so a config regression does not
  # stop a release.
  # ---------------------------------------------------------------------------
