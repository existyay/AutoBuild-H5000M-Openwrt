name: 构建 H5000M 主线 OpenWrt 固件

# Mainline OpenWrt (openwrt/openwrt main) for the Hiveton H5000M.
# Weekly scheduled build + manual dispatch + tag releases.
on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC (Beijing 12:00)
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后创建或更新 GitHub Release'
        type: boolean
        default: true
      pinned:
        description: '使用固定的上游版本 而不是分支最新提交'
        type: boolean
        default: false
      runner_type:
        description: '运行器类型'
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
      run_config_coverage:
        description: '同时运行配置覆盖测试'
        type: boolean
        default: true
      coverage_profile_set:
        description: '覆盖测试档位'
        type: choice
        options: [quick, full]
        default: quick
      enable_wwand:
        description: '5G 拨号器 ddimension wwand'
        type: boolean
        default: true
      enable_mt5700m:
        description: '5G 拨号器 luci-app-mt5700m 启用后 wwand 会被自动关闭'
        type: boolean
        default: false
      enable_adblock:
        description: 'Adblock 广告过滤'
        type: boolean
        default: true
      apk_repo_url:
        description: 'apk 仓库的托管地址 会被写入固件 留空则固件不带额外软件源'
        type: string
        default: ''
      enable_dockerman:
        description: 'Docker 容器支持'
        type: boolean
        default: false
      enable_nikki:
        description: 'Nikki 代理'
        type: boolean
        default: false
      enable_openclash:
        description: 'OpenClash 代理'
        type: boolean
        default: false
      enable_adguardhome:
        description: 'AdGuardHome 广告过滤'
        type: boolean
        default: false
  push:
    tags:
      - 'openwrt-*'
      - 'v*'

permissions:
  contents: write

# Action majors are pinned deliberately: checkout v7 / upload-artifact v7 /
# cache v6 are the first majors whose action.yml declares `using: node24`.  The
# previous v4 majors declared node20, which GitHub has deprecated, and the tree
# used to paper over that with `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true` — a
# transition-era escape hatch that runs a node20 action on a runtime it was
# never tested against.  Bumping the majors is the actual fix; do not
# reintroduce the env var, and do not downgrade below these majors.

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gate: does this host have what the configuration stage needs, and is
  # the repository internally consistent?
  # ---------------------------------------------------------------------------
  check:
    name: Repository and host checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install configuration-stage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk unzip wget curl rsync zstd git patch python3

      - name: Check build host
        run: ./scripts/check-deps.sh

      - name: Shell syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "all scripts parse"

      - name: ShellCheck (errors only)
        run: |
          # -S error: fail on real bugs (unbound variables, bad expansions) but
          # not on style.  This is the class of bug that `local a="$1" b="${a}"`
          # is: every argument is expanded before any of them is assigned.
          shellcheck -S error scripts/*.sh

      - name: Verify target support upstream
        run: |
          set -euo pipefail
          # The whole project rests on openwrt/openwrt carrying this device.
          # Fail loudly here rather than 40 minutes into a build.
          . configs/upstream.env
          url="https://raw.githubusercontent.com/openwrt/openwrt/${OPENWRT_REPO_BRANCH}/target/linux/mediatek/image/filogic.mk"

          # Fetch into a variable rather than piping into `grep -q`.  With
          # `set -o pipefail`, `grep -q` exits as soon as it matches, curl is
          # killed by SIGPIPE, and the pipeline reports failure even though the
          # match succeeded:
          #
          #   curl: (23) Failure writing output to destination
          #   ##[error]hiveton_h5000m is not defined in ...
          #
          # which is what this step did on its first run against the real file.
          devices="$(curl -fsSL "$url")" \
            || { echo "::error::could not fetch ${url}"; exit 1; }
          case "$devices" in
            *"Device/${OPENWRT_PROFILE}"*)
              echo "found Device/${OPENWRT_PROFILE} on ${OPENWRT_REPO_BRANCH}" ;;
            *)
              echo "::error::${OPENWRT_PROFILE} is not defined in ${url}"
              exit 1 ;;
          esac

      - name: Verify tree patches still apply upstream
        run: |
          set -euo pipefail
          . configs/upstream.env
          git clone --depth 1 --branch "${OPENWRT_REPO_BRANCH}" \
            "${OPENWRT_REPO_URL}" /tmp/upstream-check
          status=0
          for p in patches/*.patch; do
            echo "--- $p"
            # Absolute: `git -C` changes the working directory, so a relative
            # patch path is looked up inside the clone instead of this checkout,
            # and git reports "can't open patch ... No such file or directory"
            # for a patch that is sitting right there.
            p="$(realpath "$p")"
            if git -C /tmp/upstream-check apply --check "$p"; then
              echo "    applies"
            elif git -C /tmp/upstream-check apply --reverse --check "$p"; then
              echo "    already applied upstream"
            else
              echo "::error::patch $(basename "$p") no longer applies to ${OPENWRT_REPO_BRANCH}"
              status=1
            fi
          done
          exit $status

      - name: Verify the board plugin repositories still exist
        run: |
          set -euo pipefail
          # These three are cloned straight from their upstreams into package/ at
          # build time, so a rename, a force-push to a different default branch,
          # or a deletion would only surface deep inside a build.  Check here.
          fail=0
          for repo in \
            FAN789/luci-app-h5000m-fancontrol \
            FAN789/luci-app-h5000m-netmode \
            FAN789/luci-app-mt5700m \
            ddimension/openwrt-repo
          do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${repo}")"
            if [ "$code" = "200" ]; then
              echo "ok   ${repo}"
            else
              echo "::error::${repo} is not reachable (HTTP ${code})"
              fail=1
            fi
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # Configuration coverage: every ENABLE_* profile must still produce a valid
  # .config.  Independent of the firmware build, so a config regression does not
  # stop a release.
  # ---------------------------------------------------------------------------
  coverage:
    name: Configuration coverage
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.run_config_coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache gawk unzip wget curl rsync zstd git patch python3 \
            libncurses-dev libssl-dev zlib1g-dev

      - name: Run configuration coverage
        env:
          PROFILE_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage_profile_set || 'quick' }}
        run: ./scripts/coverage-test.sh "${PROFILE_SET}"

      - name: Upload coverage logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-logs
          path: |
            coverage-*.log
            artifacts-coverage/enabled-packages.txt
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The firmware build.
  # ---------------------------------------------------------------------------
  build:
    name: Build firmware
    needs: check
    # A self-hosted runner must carry the labels linux, x64 and h5000m.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && fromJSON('["self-hosted","linux","x64","h5000m"]') || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner_type != 'self-hosted' }}
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # The build tree reaches roughly 40 GB.  The runner has 16 GB of RAM,
          # so the swap file is not what keeps the build alive — but the ~4 GB it
          # occupies is disk this build cannot spare.
          swap-storage: true

      - name: Report disk space
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner_type != 'self-hosted' }}
        run: |
          echo "=== free space after cleanup ==="
          df -h / /mnt 2>/dev/null || df -h /
          echo "=== largest free mount ==="
          df -BG --output=avail,target / 2>/dev/null | tail -1

      - name: Install build dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner_type != 'self-hosted' }}
        # A hang here must not consume the whole 350-minute job budget.  The apt
        # call has its own timeouts now; this is the backstop.
        timeout-minutes: 20
        run: ./scripts/local-build.sh --install-deps

      - name: Resolve the upstream revision
        id: upstream
        run: |
          set -euo pipefail
          . configs/upstream.env
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.pinned }}" = "true" ]; then
            rev="${OPENWRT_PINNED_REVISION}"
          else
            rev="$(git ls-remote "${OPENWRT_REPO_URL}" "refs/heads/${OPENWRT_REPO_BRANCH}" | cut -f1)"
          fi
          [ -n "$rev" ] || { echo "::error::could not resolve the upstream revision"; exit 1; }
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"
          echo "upstream revision: ${rev}"

      # The toolchain is the longest single phase of the build, so it is cached.
      #
      # It is cached as an ARCHIVE outside the source tree, not as
      # openwrt/staging_dir itself: caching that path makes the restore create
      # openwrt/ before anything else runs, after which prepare_source's
      # `git clone` dies with "destination path already exists and is not an
      # empty directory" — which is exactly what happened the first time this
      # cache was added.  local-build.sh unpacks the archive after the clone.
      #
      # Keyed on the configuration first, the revision second, and WITH a
      # restore-keys fallback.
      #
      # Keying on the revision alone made this cache nearly useless: upstream
      # main moves every day, so the key almost never matched — the one
      # verification run after the cache was first written already missed,
      # because main had advanced from b88dfb64 to 2ed2c210 in the meantime.
      #
      # What the toolchain actually depends on is the target configuration
      # (toolchain versions, target and subtarget), not the day's revision, so
      # that is what the key is built from.  Restoring a slightly older
      # toolchain is safe: OpenWrt's stamps live in version-named directories
      # under build_dir/toolchain-<target>_gcc-<ver>_musl/, tar preserves
      # mtimes, and make rebuilds anything whose Makefile or patches are newer
      # than its .built stamp.  A toolchain that is genuinely out of date
      # therefore rebuilds itself instead of being used.
      - name: Restore toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: .toolchain-cache
          key: h5000m-toolchain-${{ hashFiles('configs/h5000m.config', 'feeds.conf.default') }}-${{ steps.upstream.outputs.rev }}
          restore-keys: |
            h5000m-toolchain-${{ hashFiles('configs/h5000m.config', 'feeds.conf.default') }}-
            h5000m-toolchain-

      - name: Restore download cache
        uses: actions/cache@v6
        with:
          path: openwrt/dl
          # Deliberately NOT keyed on the upstream revision.  Downloads are
          # identified by name and hash, so a tarball fetched for one revision is
          # exactly the same file in the next; adding the revision produced a
          # second 3.1 GB entry per run for no benefit and pushed the repository
          # towards its 10 GB cache ceiling.
          key: h5000m-dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: h5000m-dl-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            openwrt/.ccache
          key: h5000m-ccache-${{ github.run_id }}
          restore-keys: h5000m-ccache-

      - name: Build
        env:
          # Keep ccache from growing past what the repository's 10 GB cache
          # budget can hold alongside the toolchain and the downloads.
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPRESS: 'true'
          TOOLCHAIN_CACHE_ARCHIVE: ${{ github.workspace }}/.toolchain-cache/toolchain.tar.zst
          THREADS: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && '8' || '4' }}
          # `format('{0}', <bool>)` renders "true"/"false".  Without it the usual
          # `cond && input || default` fallback would rewrite a boolean input of
          # false back into the default, because a non-empty string is truthy in
          # GitHub's expression language — i.e. a switch that silently cannot be
          # turned off.
          ENABLE_FANCONTROL: 'true'
          ENABLE_NETMODE: 'true'
          ENABLE_WWAND: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_wwand) || 'true' }}
          ENABLE_MT5700M: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_mt5700m) || 'false' }}
          ENABLE_UPNP: 'true'
          ENABLE_THEME_ARGON: 'true'
          ENABLE_ADBLOCK: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_adblock) || 'true' }}
          ENABLE_REPO_PACKAGES: 'true'
          H5000M_APK_REPO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.apk_repo_url || '' }}
          ENABLE_DOCKERMAN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_dockerman) || 'false' }}
          ENABLE_NIKKI: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_nikki) || 'false' }}
          ENABLE_OPENCLASH: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_openclash) || 'false' }}
          ENABLE_MOSDNS: 'true'
          ENABLE_HOMEPROXY: 'true'
          ENABLE_ADGUARDHOME: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_adguardhome) || 'false' }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.pinned }}" = "true" ]; then
            args+=(--pinned)
          fi

          # Where the firmware should look for this project's own apk
          # repository.  The repository is published as the apk-repo artifact;
          # for the entry to work it has to be served over HTTP at this URL.
          #
          # Derived from the repository the workflow is running in rather than
          # hard-coded, so a fork gets its own URL for free.  Override with the
          # apk_repo_url input (or delete the entry on the device) if you host
          # it somewhere else — an entry pointing at a host that does not serve
          # the repository makes `apk update` report an error.
          if [ -z "${H5000M_APK_REPO_URL:-}" ]; then
            export H5000M_APK_REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "apk repository URL for the firmware: ${H5000M_APK_REPO_URL}"

          ./scripts/local-build.sh "${args[@]}"

      # Both halves are required, and this is the part that is easy to get
      # wrong: OpenWrt's completion markers (.built, .prepared) live in
      # build_dir/toolchain-*/, NOT in staging_dir/.  Caching only the installed
      # toolchain would restore the binaries and still rebuild the whole thing,
      # because make looks at the stamps.
      #
      #   build_dir/toolchain-*      ~4.0 GB, the stamps and build trees
      #   staging_dir/host           ~0.3 GB, host tools and their .prepared
      #   staging_dir/toolchain-*    ~0.4 GB, the installed cross toolchain
      #
      # zstd -1 because this runs on every build and the cache action compresses
      # again anyway; the goal is a fast archive, not a small one.
      - name: Pack the toolchain for the cache
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .toolchain-cache
          # The globs must expand INSIDE openwrt/.  Expanding them from the
          # repository root matches nothing, and with nullglob set the patterns
          # then vanish silently — an earlier version of this step cached only
          # staging_dir/host, the one literal path in the list, and reported
          # success while caching almost nothing.
          (
            cd openwrt
            shopt -s nullglob
            dirs=(build_dir/toolchain-* staging_dir/host staging_dir/toolchain-*)
            [ "${#dirs[@]}" -gt 0 ] || { echo "::warning::no toolchain to cache"; exit 0; }
            echo "caching: ${dirs[*]}"
            tar -I 'zstd -1' -cf ../.toolchain-cache/toolchain.tar.zst "${dirs[@]}"
          )
          echo "packed $(du -h .toolchain-cache/toolchain.tar.zst | cut -f1)"

      - name: Collect build info
        if: always()
        run: |
          echo "=== BUILD-INFO.txt ==="
          cat artifacts/BUILD-INFO.txt 2>/dev/null || echo "(not produced)"
          echo
          echo "=== images ==="
          ls -la artifacts/ 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: H5000M-mainline-openwrt
          path: |
            artifacts/
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload apk repository
        uses: actions/upload-artifact@v7
        with:
          name: apk-repo
          path: artifacts/apk-repo/
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        # Publish by default, for every way this workflow starts.
        #
        # The previous condition was `github.event_name == 'push' || (dispatch &&
        # publish_release)`, but `push` only fires for tags here — so the weekly
        # scheduled build produced a firmware and published nothing, which is
        # the case that most needs an artifact nobody has to fetch by hand.
        # Now only an explicit dispatch with the switch off declines.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            rel_name="${GITHUB_REF_NAME}"
          else
            rev="$(sed -n 's/^openwrt_revision=//p' BUILD-INFO.txt)"
            rel_name="openwrt-${rev}"
          fi

          # Every firmware image this build produces, not just the sysupgrade
          # one: the initramfs is the recovery image, and the rootfs tarball is
          # what a chroot or container needs.  A release that carries only one of
          # them means fetching the Actions artifact — which expires — for the
          # others.
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(find . -maxdepth 1 -type f \( \
                  -name '*squashfs-sysupgrade.bin' \
                  -o -name '*initramfs-kernel.bin' \
                  -o -name '*targz-rootfs.tar.gz' \
                  -o -name 'BUILD-INFO.txt' \
                  -o -name 'profiles.json' \
                  -o -name '*.manifest' \) -print0)

          rev="$(sed -n 's/^openwrt_revision=//p' BUILD-INFO.txt)"
          kver="$(sed -n 's/^kernel_version=//p' BUILD-INFO.txt)"
          abi="$(sed -n 's/^kernel_abi=//p' BUILD-INFO.txt)"
          nfiles="$(printf '%s\n' "${files[@]}" | wc -l)"

          notes="主线 OpenWrt（openwrt/openwrt main）Hiveton H5000M 固件。

          上游版本：${rev}
          内核版本：${kver}
          内核 ABI：${abi}
          构建日期：$(date -u +%Y-%m-%d)

          已包含 luci-app-h5000m-fancontrol 风扇温控、luci-app-h5000m-netmode 出口优先级、
          以及 ddimension/wwand 5G 拨号器。

          刷机请用 *squashfs-sysupgrade.bin；*initramfs-kernel.bin 是恢复镜像；
          *targz-rootfs.tar.gz 供容器或 chroot 使用。内核 ABI 见 BUILD-INFO.txt，
          安装内核模块时必须与固件一致。

          软件包仓库：https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

          echo "publishing ${nfiles} files as ${rel_name}"
          printf '  %s\n' "${files[@]}"

          if gh release view "${rel_name}" >/dev/null 2>&1; then
            gh release upload "${rel_name}" "${files[@]}" --clobber
          else
            gh release create "${rel_name}" "${files[@]}" \
              --title "H5000M mainline OpenWrt ${rel_name}" \
              --notes "${notes}"
          fi

  # Publishes artifacts/apk-repo/ to GitHub Pages, which is what makes the
  # firmware's built-in source entry reachable.  The URL is derived from the
  # repository at build time (see H5000M_APK_REPO_URL above), so this job is
  # what turns that URL from a promise into something apk can actually read.
  #
  # continue-on-error because Pages has to be enabled once in the repository
  # settings.  A build that produced a perfectly good firmware must not be
  # marked failed because the optional hosting step was not configured yet.
  publish-apk-repo:
    needs: build
    # Always: the firmware's built-in source entry points here, so
    # publishing it is part of producing a usable firmware.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the apk repository
        uses: actions/download-artifact@v8
        with:
          name: apk-repo
          path: apk-repo

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Turn Pages on if it is off.  Without this the step dies with
          # "Get Pages site failed" and — because the job is continue-on-error so
          # that a hosting problem cannot fail a good build — the firmware ships
          # pointing at a URL that 404s, which is worse than pointing nowhere.
          enablement: true

      # A bare repository directory has no index.html, so the site root answers
      # 404 and looks broken even though packages.adb is served correctly.  This
      # page says what the directory is and how to point a router at it.
      - name: Write an index page
        run: |
          set -euo pipefail
          count="$(find apk-repo -maxdepth 1 -name '*.apk' | wc -l)"
          size="$(du -sh apk-repo | cut -f1)"
          cat > apk-repo/index.html <<EOF
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>H5000M apk 软件包仓库</title>
            <style>
              body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                     max-width: 46rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.7; }
              code { background: #f4f4f5; padding: .15em .35em; border-radius: .25rem; }
              pre  { background: #f4f4f5; padding: .8rem 1rem; border-radius: .4rem; overflow-x: auto; }
              h1   { font-size: 1.5rem; }
            </style>
          </head>
          <body>
            <h1>Hiveton H5000M 主线 OpenWrt 软件包仓库</h1>
            <p>这是固件自带的软件源，包含 <strong>${count}</strong> 个软件包，共 ${size}。
               内核模块与固件同一次构建产出，因此 ABI 完全匹配。</p>
            <p>索引地址：<a href="packages.adb">packages.adb</a></p>
            <h2>在路由器上使用</h2>
            <p>固件构建时已把这个地址写入 <code>/etc/apk/repositories.d/50-h5000m.list</code>，
               通常无需手动配置。若需手工添加：</p>
            <pre>echo 'https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/packages.adb' \\
            >> /etc/apk/repositories.d/customfeeds.list
          apk update
          apk add luci-app-passwall</pre>
            <p>可安装的代理面板包括 PassWall、PassWall2、HomeProxy、MosDNS、Nikki、
               Momo、NeKoBox、v2rayA、OpenClash 以及各自的中文语言包。</p>
          </body>
          </html>
          EOF
          echo "index.html written ($(wc -c < apk-repo/index.html) bytes)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apk-repo

      - name: Deploy to Pages
