name: 发布 PR 维护（Release Please）

# Release Please turns Conventional Commits into a release PR: it maintains a
# changelog and a version bump, and only when that PR is merged does it tag.
#
# Why this project wants it: the firmware build is triggered by tags
# (`openwrt-*`, `v*`), and the release notes for a flashed image should say what
# changed in Chinese, grouped by feat/fix/perf — not "commits since last time".
# It also gives every release a single reviewable diff before it ships.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: 维护发布 PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The minimum this automation needs: read the repo, write the release PR
      # and the tag.  No `packages`, no `actions`, no `id-token`.
      contents: write
      pull-requests: write
    steps:
      # A Reusable-Workflow-style call is not used here because Release Please
      # publishes its own action; it is pinned by SHA like everything else.
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT, not the default GITHUB_TOKEN.  This is not a preference —
          # events created BY `GITHUB_TOKEN` do not trigger further workflows,
          # which broke two things at once, both measured on this repository:
          #
          #   1. The release PR's checks never ran.  They sat at
          #      `completed/action_required` and needed a human to click
          #      "Approve and run", so the release PR could never auto-merge.
          #   2. The tag Release Please created did NOT trigger build.yml, so
          #      releasing a version produced a tag and a Release **with no
          #      firmware attached** — `v1.1.0` shipped exactly like that.
          #
          # With a PAT the actor is a real user, so both events behave normally:
          # the checks run on their own and the tag starts the firmware build.
          #
          # Falls back to GITHUB_TOKEN when the secret is absent (a fork, or a
          # clone that has not set it up), which restores the old — degraded but
          # working — behaviour rather than failing outright.
          #
          # The token is a fine-grained PAT scoped to this repository with only
          # `contents: write` and `pull-requests: write`.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # `simple` for a repository whose artefact is not an npm/pypi package:
          # it bumps a VERSION-bearing release and writes CHANGELOG.md, and the
          # tag it creates (`v*`) matches build.yml's trigger.
          release-type: simple
          include-component-in-tag: false
          # Release Please defaults this pattern to `chore${scope}: release...`
          # with ${scope} = the branch name, i.e. `chore(master): ...`.  That
          # collides with commitlint's fixed scope enum and the scope would
          # change if the default branch were ever renamed.  Pinning it to the
          # literal `release` scope — which IS in that enum — makes the release
          # commit valid by construction instead of by exception.
          pull-request-title-pattern: 'chore(release): release ${version}'
          # The firmware itself is versioned by its upstream revision
          # (openwrt-<sha>), which Release Please cannot know.  So this manages
          # the PROJECT version and the changelog; build.yml keeps naming the
          # firmware after the upstream commit it was built from.
