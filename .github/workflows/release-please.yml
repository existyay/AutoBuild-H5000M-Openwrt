name: 发布 PR 维护（Release Please）

# Release Please turns Conventional Commits into a release PR: it maintains a
# changelog and a version bump, and only when that PR is merged does it tag.
#
# Why this project wants it: the firmware build is triggered by tags
# (`openwrt-*`, `v*`), and the release notes for a flashed image should say what
# changed in Chinese, grouped by feat/fix/perf — not "commits since last time".
# It also gives every release a single reviewable diff before it ships.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: 维护发布 PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # `contents: write` + `pull-requests: write` are what Release Please needs
      # to maintain the release PR and create the tag.  `actions: write` is for
      # the explicit build dispatch at the bottom of this job — nothing else here
      # uses it.
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Record the release branch's head before Release Please runs, so the
      # approval step below can tell "this run pushed a new commit to the release
      # branch" from "nothing changed".
      #
      # Measured cost of not knowing, on the 1.1.9 release (run 38973915382,
      # 2026-10-16): the merge had already deleted the branch, so the approval
      # step polled its full 200 s before concluding there was nothing to
      # approve — and that delay sits directly in front of the step that
      # dispatches the firmware build.  That run started at 22:08:24; the build
      # run it eventually dispatched was not created until 22:12:20.  Roughly
      # four minutes of release latency, for nothing.
      - name: 记下发布分支当前的 head
        id: release_branch_head
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: release-please--branches--${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          # Empty when the branch does not exist, which is the normal state right
          # after a release PR has been merged.
          sha="$(gh api "repos/${GH_REPO}/git/ref/heads/${RELEASE_BRANCH}" \
                   --jq '.object.sha' 2>/dev/null || true)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "发布分支 ${RELEASE_BRANCH} 当前 head: ${sha:-（分支不存在）}"

      # A Reusable-Workflow-style call is not used here because Release Please
      # publishes its own action; it is pinned by SHA like everything else.
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # `GITHUB_TOKEN`, deliberately — and the reason is signatures.
          #
          # A PAT was tried and had to be reverted.  With a PAT the commit is
          # authored AND committed by the token's owner, and GitHub does not
          # apply its web-flow signature to it:
          #
          #   GITHUB_TOKEN : committer "GitHub <noreply@github.com>" -> verified=true
          #   PAT          : committer <the user>                    -> verified=false, reason=unsigned
          #
          # An unsigned release commit is then rejected by this repository's
          # `required_signatures` ruleset rule, so the release PR can never
          # merge.  release-please-action cannot sign commits itself (its only
          # signing-related input is `token`), so there is no way to have both a
          # PAT and a signed release commit.  `GITHUB_TOKEN` wins because it
          # produces a signed commit, which is what the ruleset requires.
          #
          # The two things the PAT was meant to fix are handled as follows:
          #   * the tag-triggered build — by the explicit dispatch step below,
          #     since `workflow_dispatch` is the documented exception to the
          #     "GITHUB_TOKEN events do not start workflows" rule;
          #   * the release PR's checks needing approval — by the approval step
          #     below.  This was previously recorded here as an accepted one
          #     click per release.  It was automated because the click approved
          #     *executing* the checks, not the content: the content decision is
          #     the merge, and that stays human (auto-merge is never enabled on
          #     a release PR).  The step's own comment records what bounds it.
          token: ${{ secrets.GITHUB_TOKEN }}
          # `simple` for a repository whose artefact is not an npm/pypi package:
          # it bumps a VERSION-bearing release and writes CHANGELOG.md, and the
          # tag it creates (`v*`) matches build.yml's trigger.
          release-type: simple
          include-component-in-tag: false
          # NOTE: `pull-request-title-pattern` was set here and did nothing, so it
          # was removed.  Recorded because the obvious fix does not work and the
          # next person will reach for the same input.
          #
          # Release Please titles a release PR `chore${scope}: release X` with
          # ${scope} = the branch name, i.e. `chore(master): ...` — not in
          # commitlint's fixed scope enum.  Setting
          # `pull-request-title-pattern: 'chore(release): ...'` looks like the
          # fix.  This action never reads it:
          #
          #   * `parseInputs()` in release-please-action v5.0.0 accepts a FIXED
          #     input list (token, release-type, path, target-branch,
          #     config-file, manifest-file, include-component-in-tag, …) and that
          #     key is not in it;
          #   * and when `release-type` IS given, the action builds its config
          #     from just five keys — releaseType, includeComponentInTag,
          #     changelogHost, versioning, releaseAs — so the key would be dropped
          #     even if it had been read.
          #
          # Measured, not inferred: the setting was present and PR #19 still came
          # out titled `chore(master): release 1.1.4`.
          #
          # Making it real means moving this job to config-file mode
          # (`release-please-config.json`), which is a larger change than the
          # problem deserves.  The generated title is therefore accepted as-is,
          # and commitlint exempts exactly that shape (`chore(<anything>): release`)
          # — see the `ignores` list in commitlint.config.mjs.  That rule, not
          # this file, is what keeps the gate green.
          # The firmware itself is versioned by its upstream revision
          # (openwrt-<sha>), which Release Please cannot know.  So this manages
          # the PROJECT version and the changelog; build.yml keeps naming the
          # firmware after the upstream commit it was built from.

      # Click "Approve and run" on the checks Release Please's own push cannot
      # start.
      #
      # Measured on PR #34 (2026-10-16): the release branch is pushed with
      # `GITHUB_TOKEN`, and GitHub holds every `pull_request` run that push
      # creates at `action_required` until someone with write access approves it.
      # The Required Status Checks are produced BY those runs, so while they are
      # unapproved the release PR sits at
      #
      #     mergeable_state=blocked, 0 check runs on the head commit
      #
      # waiting for a check that will never appear on its own.
      #
      # Best-effort on purpose: `continue-on-error` and `::warning::` rather than
      # a red job, because the fallback — approving by hand in the Actions tab —
      # has to stay usable if GitHub refuses a `GITHUB_TOKEN` approval.
      #
      # What bounds it, since approving a run means letting a workflow execute:
      #   * it only looks at runs whose head branch is the release branch Release
      #     Please maintains, never at an arbitrary branch;
      #   * a release PR's diff is `CHANGELOG.md` alone — measured on the 1.1.8
      #     release commit `620e12e`, whose stat is exactly
      #     `CHANGELOG.md | 7 +++++++`, one file — so the workflows being
      #     approved are master's own, unmodified by the PR.
      - name: 批准发布 PR 上待批准的检查运行
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Release Please's branch naming, taken from the live PR rather than
          # guessed: the open release PR's head ref is literally
          # `release-please--branches--master`.  `--components--<name>` is only
          # appended in config-file mode, which this job does not use.
          RELEASE_BRANCH: release-please--branches--${{ github.event.repository.default_branch }}
          # Recorded before Release Please ran, by the step above.
          BEFORE_SHA: ${{ steps.release_branch_head.outputs.sha }}
        run: |
          set -uo pipefail
          now="$(gh api "repos/${GH_REPO}/git/ref/heads/${RELEASE_BRANCH}" \
                   --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$now" ]; then
            # The usual state on a release run: the merge deleted the branch, so
            # there is nothing here to approve and no reason to poll for 200 s.
            echo "发布分支 ${RELEASE_BRANCH} 不存在——没有要批准的东西"
            exit 0
          fi

          ids=""
          # The push happens inside the previous step, so the runs it creates do
          # not exist yet — the `pull_request` event lands a few seconds later.
          for _ in $(seq 1 20); do
            ids="$(gh api \
                     "repos/${GH_REPO}/actions/runs?branch=${RELEASE_BRANCH}&per_page=50" \
                     --jq '.workflow_runs[]
                           | select(.conclusion == "action_required"
                                    or .status == "waiting")
                           | .id' 2>/dev/null || true)"
            if [ -n "$ids" ]; then break; fi
            # If the branch head did not move, this run pushed nothing and cannot
            # have produced a new run to approve.  One query has already been
            # made above, which is what picks up a leftover that a previous run
            # failed to approve; waiting longer would only delay the build
            # dispatch below.
            if [ "$now" = "${BEFORE_SHA}" ]; then break; fi
            sleep 10
          done

          if [ -z "$ids" ]; then
            echo "no run on ${RELEASE_BRANCH} is waiting for approval (nothing to do)"
            exit 0
          fi

          failed=0
          for id in $ids; do
            if gh api --method POST "repos/${GH_REPO}/actions/runs/${id}/approve" >/dev/null; then
              echo "approved run ${id}"
            else
              echo "::warning::run ${id} was not approved by GITHUB_TOKEN"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::warning::${failed} run(s) still need a human: approve them in the Actions tab, then merge the release PR"
          fi

      # Start the firmware build for the tag Release Please just created.
      #
      # A tag pushed with `GITHUB_TOKEN` does NOT trigger other workflows — that
      # is why `v1.1.0` shipped as a Release with no assets at all.  A tag pushed
      # with a real user's token DOES (measured on `v1.1.2`, which built itself),
      # but that route costs the signed commit.  `workflow_dispatch` is the
      # documented exception to the GITHUB_TOKEN rule, so the build is started
      # explicitly instead of relying on the tag event.
      - name: 为新 tag 触发固件构建
        if: steps.release.outputs.release_created == 'true'
        env:
          # Passed through the environment rather than interpolated into the
          # shell — the tag name is action output, and `${{ }}` inside `run:` is
          # text substitution before bash parses the line.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required, and the reason v1.1.3 shipped with no firmware.
          #
          # `gh` resolves the repository from the git remote of the **current
          # directory**.  This job never runs actions/checkout — release-please
          # is a container action that only talks to the API — so there is no
          # `.git` anywhere above the workspace and every `gh` call here died
          # with:
          #
          #     failed to run git: fatal: not a git repository ...
          #     ##[error]Process completed with exit code 1.
          #
          # The `gh workflow run` on the next line had already succeeded (a
          # dispatch needs no local repo), so the tag was created, the build was
          # queued, and then this verification loop killed the job.  The build it
          # had queued went unconfirmed and the release kept zero assets.
          #
          # `GH_REPO` makes repo resolution independent of the working tree, so
          # this step no longer depends on a checkout it was never given.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "dispatching build.yml on ${TAG_NAME}"
          gh workflow run build.yml --ref "${TAG_NAME}"
          # `gh workflow run` only queues the dispatch; confirm it exists so a
          # silent failure here cannot leave a tag with no firmware, which is
          # exactly the state v1.1.0/v1.1.1 were left in.
          for _ in $(seq 1 10); do
            sleep 6
            if gh run list --workflow=build.yml --branch "${TAG_NAME}" \
                 --json databaseId --jq 'length' | grep -qv '^0$'; then
              echo "build queued for ${TAG_NAME}"
              exit 0
            fi
          done
          echo "::error::no build.yml run appeared for ${TAG_NAME} after dispatch — release it by hand"
          exit 1

