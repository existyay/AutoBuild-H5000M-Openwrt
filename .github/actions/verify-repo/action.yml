name: Verify apk repository
description: >-
  Point a throw-away apk database at one package repository and assert the
  front-ends, cores, translations, kernel modules and dependency resolution the
  project promises.  Wraps scripts/verify-apk-repo.sh so the same check can be
  reused by build.yml, a release gate and a manual dispatch without copying the
  shell.

# A Composite Action is the right tool when the reusable unit is a SEQUENCE OF
# STEPS that needs no runner or job of its own.  A Reusable Workflow would be
# wrong here: it would spin up a second runner just to run a 5-second check.

inputs:
  apk:
    description: Path to the apk binary built by this tree.
    required: false
    default: openwrt/staging_dir/host/bin/apk
  target:
    description: Repository index (path or URL) to verify. Empty = auto-detect.
    required: false
    default: ''
  # snake_case for the same reason as in diagnose/action.yml: these are read
  # from expressions, where a hyphen would be parsed as subtraction.
  with_official_feeds:
    description: Also configure the snapshot sources the firmware ships with.
    required: false
    default: 'false'
  working_directory:
    description: Directory the paths are relative to.
    required: false
    # /o only exists in build.yml, which bind-mounts the workspace there to keep
    # TMPDIR socket paths short.  Any other caller has the repository at
    # ${{ github.workspace }}, so that is the sane default.
    default: ${{ github.workspace }}

outputs:
  result:
    description: pass or fail
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Verify the repository
      id: run
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        APK_BIN: ${{ inputs.apk }}
        APK_TARGET: ${{ inputs.target }}
        WITH_FEEDS: ${{ inputs.with_official_feeds }}
      run: |
        set -uo pipefail
        args=()
        [ "$WITH_FEEDS" = "true" ] && args+=(--with-official-feeds)
        [ -n "$APK_TARGET" ] && args+=("$APK_TARGET")
        # The script prefers openwrt/staging_dir/host/bin/apk itself and falls
        # back to APK_OVERRIDE (this input), so a caller can point at a
        # different build.
        #
        # The exit status has to be propagated: this script runs with
        # `set -uo pipefail` and no `-e`, so a failing verification used to fall
        # through to `echo result=pass`, report success, and leave the step
        # green — a gate that never fails.
        rc=0
        if [ -n "$APK_BIN" ] && [ -x "$APK_BIN" ]; then
          APK_OVERRIDE="$APK_BIN" ./scripts/verify-apk-repo.sh "${args[@]}" || rc=$?
        else
          ./scripts/verify-apk-repo.sh "${args[@]}" || rc=$?
        fi
        if [ "$rc" -ne 0 ]; then
          echo "result=fail" >> "$GITHUB_OUTPUT"
          exit "$rc"
        fi
        echo "result=pass" >> "$GITHUB_OUTPUT"
